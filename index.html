<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Confere aí</h1>
        <nav>
            <a href="#" class="cabecalho-link">Início</a>
        </nav>
    </header>

    <main>
        <h2>Descubra a verdade passando o mouse</h2>
        <section>
           
            <article class="cartao">
           <div class="cartao-interno">
                    <div class="cartao-frente">
                        <img src="pinguin1.jpg" alt="pinguim" class="cartao-imagem">
                  <p>Pinguins conseguem voar como pássaros!</p>
                    </div>
                <div class="cartao-verso">
                        <img src="pinguin2.webp" alt="pinguim" class="cartao-imagem">
                        <p>Pinguins não voam, mas são excelentes nadadores</p>
               </div>
         </div>
            </article>

            <article class="cartao">
                <div class="cartao-interno">
                    <div class="cartao-frente">
                        <img src="pinguin3.webp" alt="pinguim" class="cartao-imagem">
                        <p>Pinguins vivem no Polo norte</p>
                    </div>
                    <div class="cartao-verso">
                        <img src="pinguin4.jpg" alt="" class="cartao-imagem">
                        <p>Pinguins vivem no hemisfério Sul</p>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <footer>
        <p>Projeto desenvolvido por Renan</p>
    </footer>
</body>
</html>
