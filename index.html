<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Flash Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <nav>

                    </div>

            <article class="cartao">

                    </div>
                    <div class="cartao-verso">
